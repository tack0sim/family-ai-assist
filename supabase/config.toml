# Supabase CLI project configuration for CLOUD DEPLOYMENT ONLY
# https://supabase.com/docs/guides/local-development/cli/config
#
# This file is used by the Supabase CLI to:
#   - Push migrations to the remote cloud project via `supabase db push`
#   - Manage production deployment via `supabase link` and related commands
#
# Local development uses the custom Docker Compose stack in supabase/docker-compose.yml
# and supabase/local-setup.sh — this config.toml is NOT used for local development.

project_id = "twowzxblypmvywqiegvy"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000


[auth]
enabled = true

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[storage]
enabled = true
